name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:
  repository_dispatch:
    types: [notes-updated]  # Triggered by rnemeth90/notes when it changes
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Checkout notes source
        uses: actions/checkout@v4
        with:
          repository: rnemeth90/notes
          path: notes-src
          token: ${{ secrets.NOTES_REPO_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        run: cargo install mdbook

      - name: Generate SUMMARY.md
        working-directory: notes-src
        run: python3 generate_summary.py

      - name: Build mdBook
        working-directory: notes-src
        run: mdbook build

      - name: Copy notes into Hugo public dir
        run: |
          rm -rf public/notes
          mkdir -p public/notes
          # notes-src/book.toml sets src = ".", so mdbook copies the whole repo
          # root (including .git/.gitmodules) into book/. Exclude those so we
          # never commit a stray submodule gitlink to gh-pages.
          rsync -a --exclude='.git*' --exclude='.github' notes-src/book/ public/notes/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
