apiVersion: batch/v1
kind: Job
metadata:
  name: sync-lab-precheck
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: precheck
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args: ["echo 'PreSync: validate prerequisites before applying app resources'"]
