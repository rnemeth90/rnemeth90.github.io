apiVersion: batch/v1
kind: Job
metadata:
  name: sync-lab-postcheck
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: postcheck
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              wget -q -O - http://sync-lab-web | grep -q 'Argo CD sync lab' &&
              echo 'PostSync: app endpoint is responding'
