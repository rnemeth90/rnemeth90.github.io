apiVersion: batch/v1
kind: Job
metadata:
  name: sync-lab-sync-check
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sync-check
          image: busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args: ["echo 'Sync hook: run alongside resources in the Sync phase'"]
