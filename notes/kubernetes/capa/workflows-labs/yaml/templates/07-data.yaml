# data: source artifacts + transform them with an expression, no pod runs your code.
# this lists objects in the quick-start minio bucket and keeps only .txt ones.
# the output of the transformation is the list of object names
# NOTE: least tested of the 7. check the secret name/keys with `kubectl get secret -n argo`
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: tt-data-
  namespace: argo
spec:
  entrypoint: main
  templates:
    - name: main
      steps:
        - - name: make-artifact       # puts something in the bucket first
            template: make
        - - name: list-txt
            template: list-txt
    - name: make
      container:
        image: alpine:3.20
        command: [sh, -c]
        args: ["echo hi > /tmp/x.txt"]
      outputs:
        artifacts:
          - name: x
            path: /tmp/x.txt
    - name: list-txt
      data:
        source:
          artifactPaths:
            name: bucket
            s3:
              endpoint: minio:9000
              bucket: my-bucket
              insecure: true
              accessKeySecret: {name: my-minio-cred, key: accesskey}
              secretKeySecret: {name: my-minio-cred, key: secretkey}
        transformation:
          - expression: "filter(data, {# endsWith \".txt\"})"
