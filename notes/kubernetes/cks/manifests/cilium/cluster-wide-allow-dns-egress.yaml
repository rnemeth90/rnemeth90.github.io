# Allow every pod in every namespace to resolve DNS via CoreDNS.
#
# Pair with a default-deny-egress policy elsewhere in the cluster: this rule
# only grants the DNS egress path, it does not grant any other traffic.

apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "cluster-wide-allow-dns-egress"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: "ANY"
