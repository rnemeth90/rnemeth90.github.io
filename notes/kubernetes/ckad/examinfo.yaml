---
exam:
  name: Certified Kubernetes Application Developer
  abbreviation: CKAD
  provider: Linux Foundation / CNCF
  official_page: https://www.cncf.io/certification/ckad/
  curriculum: https://github.com/cncf/curriculum
  candidate_handbook: https://www.cncf.io/certification/candidate-handbook
  exam_tips: https://www2.thelinuxfoundation.org/ckad-tips
  level: associate / developer
  description: >
    Validates the skills, knowledge, and competency to design, build,
    configure, and expose cloud native applications for Kubernetes.
  prerequisites: none

format:
  delivery: online, proctored
  question_type: performance-based, hands-on command-line tasks
  duration_minutes: 120
  passing_score_percent: 66
  language: English
  open_book: Kubernetes.io docs accessible during the exam

cost:
  exam_usd_approx: 445
  note: list price, includes one free retake; varies with bundles/promos

policy:
  validity_years: 3
  retakes_included: 1

domains:
  - name: Application Design and Build
    weight_percent: 20
    dir: application-design-and-build
  - name: Application Deployment
    weight_percent: 20
    dir: application-deployment
  - name: Application Observability and Maintenance
    weight_percent: 15
    dir: application-observability-and-maintenance
  - name: Application Environment, Configuration and Security
    weight_percent: 25
    dir: application-environment-configuration-and-security
  - name: Services and Networking
    weight_percent: 20
    dir: services-and-networking

preparation:
  study_resources:
    - name: CNCF Kubernetes Curriculum (GitHub)
      url: https://github.com/cncf/curriculum
    - name: CKAD Exercises (community)
      url: https://github.com/dgkanatsios/CKAD-exercises
    - name: VIM Cheatsheet
      url: https://devhints.io/vim
    - name: TMUX Cheat Sheet
      url: https://gist.github.com/MohamedAlaa/2961058
  practice:
    - name: CKAD Practice Questions
      url: https://dev.to/liptanbiswas/ckad-practice-questions-4mpn
