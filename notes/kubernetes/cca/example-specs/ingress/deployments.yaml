apiVersion: v1
kind: Namespace
metadata:
  name: app1
  labels:
    name: app1
---
apiVersion: v1
kind: Namespace
metadata:
  name: app2
  labels:
    name: app2
---
apiVersion: v1
kind: Namespace
metadata:
  name: app3
  labels:
    name: app3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: app1
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        command: ["/bin/sh", "-c"]
        args:
          - echo "<html><body><h1>app1 - $(hostname)</h1></body></html>" > /usr/share/nginx/html/index.html && nginx -g "daemon off;"
        ports:
          - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app1
  namespace: app1
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
---
