---
exam:
  name: Cisco Certified Network Associate
  abbreviation: CCNA
  exam_code: 200-301 CCNA
  provider: Cisco
  official_page: https://www.cisco.com/site/us/en/learn/training-certifications/certifications/ccna/index.html
  level: associate
  description: >
    Validates a broad range of fundamentals for IT careers based on
    the latest networking technologies, software development skills,
    and job roles — covering network fundamentals, access, IP
    connectivity/services, security fundamentals, and automation.
  target_audience:
    - Network/systems administrators
    - Help desk / NOC engineers
    - Anyone building a foundation in networking
  recommended_background:
    - Basic understanding of networking concepts helpful but not required
  prerequisites: none

format:
  delivery: Pearson VUE (in-person or online proctored)
  question_type: multiple-choice, drag-and-drop, simulation (simlets/testlets)
  question_count_approx: 90-110
  duration_minutes: 120
  passing_score: scaled 300-1000 range; exact cut score not published by Cisco
  language: English, Japanese

cost:
  exam_usd_approx: 300
  note: list price, varies by country/region

policy:
  validity_years: 3
  recertification: continuing education credits or retake

domains:
  - name: Network Fundamentals
    weight_percent: 20
    dir: network-fundamentals
  - name: Network Access
    weight_percent: 20
    dir: network-access
  - name: IP Connectivity
    weight_percent: 25
    dir: ip-connectivity
  - name: IP Services
    weight_percent: 10
    dir: ip-services
  - name: Security Fundamentals
    weight_percent: 15
    dir: security-fundamentals
  - name: Automation and Programmability
    weight_percent: 10
    dir: automation-and-programmability

preparation:
  study_resources:
    - name: Cisco CCNA 200-301 Official Exam Topics
      url: https://www.cisco.com/site/us/en/learn/training-certifications/certifications/ccna/index.html
    - name: Cisco Packet Tracer
      url: https://www.netacad.com/cisco-packet-tracer
  labs:
    - Build small switched/routed topologies in Packet Tracer or GNS3/EVE-NG
    - Configure VLANs, trunking, and inter-VLAN routing
    - Configure and verify OSPFv2 single-area routing
    - Configure NAT, DHCP, and basic ACLs
    - Configure SSH access and port security
    - Explore device automation via NETCONF/RESTCONF or a vendor API
